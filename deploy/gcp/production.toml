# Production on Google Cloud. Values in <angle brackets> are yours to fill in; scripts/gcp.py refuses to run while any remain.
# Nothing secret goes in this file (it is committed). Secrets live in Secret Manager: `make secret ENV=production NAME=...`.

[project]
id = "<your-gcp-project-id>"             # the project ID (lowercase, with dashes), not its display name
region = "asia-south1"                   # Mumbai
billing_account = "<XXXXXX-XXXXXX-XXXXXX>"   # gcloud billing accounts list
budget = "5000INR"                       # amount + the CURRENCY OF YOUR BILLING ACCOUNT (INR or USD). Alerts at 50%, 80%, 100%. It warns, it does not stop spending

[service]
min_instances = 0                        # raise to 1 (about $8-12/month more) when cold starts of 5-10 s start to annoy real users
max_instances = 3

# Only the names of extra secrets (the LLM key for the provider chosen below, the email key, the Sentry address, and the database address used for backups). Their values go in with `make secret`.
secrets = ["ANTHROPIC_API_KEY", "RESEND_API_KEY", "SENTRY_DSN", "BACKUP_DATABASE_URL"]

[env]
ENV = "production"
LLM_PROVIDER = "anthropic"               # paid tier whose terms exclude training on our data (CLAUDE.md). "none" = no LLM, manual pickers only (then drop ANTHROPIC_API_KEY from secrets)
LLM_DAILY_CALL_LIMIT = "500"             # AI calls per day; past it onboarding uses the manual pickers until tomorrow. 0 = no cap
APP_URL = "<https://app.yourdomain>"     # the Vercel production app (https://circuit-app-production.vercel.app until the domain exists)
LANDING_URL = "<https://yourdomain>"
API_URL = "auto"                         # auto = https://circuit-production-api-<project number>.<region>.run.app. After mapping a custom domain, write it here
ALLOWED_HOSTS = ".run.app"               # add api.<domain> once it is mapped. Probes and the smoke test reach the service through *.run.app addresses
CORS_ALLOWED_ORIGINS = "<https://app.yourdomain>"   # exactly APP_URL, no slash at the end
CSRF_TRUSTED_ORIGINS = "https://*.run.app"          # the Django admin's login form posts from the API origin; add https://api.<domain> later
ADMIN_PATH = "<pick-a-random-path>/"     # the admin's address. This file is public, so choose your own: python -c "import secrets; print(secrets.token_urlsafe(12))"
SUPABASE_URL = "<https://xxxx.supabase.co>"
STORAGE_PROVIDER = "supabase"
EMAIL_BACKEND = "resend"
EMAIL_FROM = "Circuit <hello@<yourdomain>>"   # production refuses Resend's @resend.dev test sender: verify your domain in Resend first
SUPPORT_EMAIL = "<support@yourdomain>"
SEED_CITY_NAME = "Chennai"
SEED_CITY_LAT = "13.0827"
SEED_CITY_LNG = "80.2707"
BETA_MODE = "true"                       # invite-only until public launch
TRUSTED_PROXY_HOPS = "1"                 # Cloud Run's front end is one hop
FEATURES = "pulse:everyone,daily_drop:everyone,circuits:testers"   # PRODUCTION.md §2b, beta start
POLICY_VERSION = "2026-01"
GRIEVANCE_OFFICER_NAME = "<name>"        # DPDP: shown to members. Fill in before real users
GRIEVANCE_EMAIL = "<grievance@yourdomain>"
GRIEVANCE_ADDRESS = "<postal address>"
BACKUP_AGE_RECIPIENT = "<age1...>"       # the PUBLIC key of your backup key pair (`age-keygen -o backup.key` prints it). Keep backup.key itself offline. The bucket is created by `make gcp-setup`

# Alerts go to these Cloud Monitoring notification channels, by display name. You create them once in the Cloud Console
# (Monitoring > Alerting > Edit notification channels): an email one, and an SMS or Cloud Console mobile-app one so it reaches your phone.
# `make monitoring ENV=production` stops with a clear message if a name here does not exist. infra/monitoring/README.md.
[monitoring]
notification_channels = ["<Circuit production on-call email>", "<Circuit production on-call phone>"]
