# Production on Google Cloud. Values in <angle brackets> are yours to fill in; scripts/gcp.py refuses to run while any remain.
# Nothing secret goes in this file (it is committed). Secrets live in Secret Manager: `make secret ENV=production NAME=...`.

[project]
id ="circuit-prod-512816"              # the project ID (lowercase, with dashes), not its display name
region = "asia-south1"                   # Mumbai
billing_account="015FB8-CECCDA-327404"
budget="8000INR"# amount + the CURRENCY OF YOUR BILLING ACCOUNT (INR or USD). Alerts at 50%, 80%, 100%. It warns, it does not stop spending

[service]
min_instances = 0                        # raise to 1 (about $8-12/month more) when cold starts of 5-10 s start to annoy real users
max_instances = 3

# Only the names of extra secrets (the email key now; later the LLM key for the provider chosen below, the Sentry address, REDIS_URL and BACKUP_DATABASE_URL). Their values go in with `make secret`.
secrets = ["RESEND_API_KEY"]

[env]
ENV = "production"            # AI calls per day; past it onboarding uses the manual pickers until tomorrow. 0 = no cap
APP_URL = "https://circuit-phi.vercel.app/"     # the Vercel production app (https://circuit-app-production.vercel.app until the domain exists)
LANDING_URL = "https://circuit-phi.vercel.app/"
API_URL = "auto"                         # auto = https://circuit-production-api-<project number>.<region>.run.app. After mapping a custom domain, write it here
ALLOWED_HOSTS = ".run.app"               # add api.<domain> once it is mapped. Probes and the smoke test reach the service through *.run.app addresses         # the Django admin's login form posts from the API origin; add https://api.<domain> later
ADMIN_PATH = "xY3k_9fQ2bLm/"     # the admin's address. This file is public, so choose your own: python -c "import secrets; print(secrets.token_urlsafe(12))"
SUPABASE_URL = "https://hhnyfsvhupdijzvemeaj.supabase.co"
CSRF_TRUSTED_ORIGINS = "https://*.run.app"   # the Django admin login posts from the API origin. Add https://api.<domain> once it is mapped
CORS_ALLOWED_ORIGINS = "https://circuit-app.vercel.app"
GRIEVANCE_OFFICER_NAME = "G Lokesh Kumar"
GRIEVANCE_EMAIL = "support@circuitapp.net"
GRIEVANCE_ADDRESS = "pondicherry,India"
LLM_PROVIDER = "none"                    # no AI in the beta: onboarding uses the manual pickers. To switch on: set gemini|groq|anthropic here AND add <NAME>_API_KEY to `secrets` above
STORAGE_PROVIDER = "supabase"
EMAIL_BACKEND = "resend"
EMAIL_FROM = "Circuit <support@circuitapp.net>"   # production refuses Resend's @resend.dev test sender: verify your domain in Resend first
SUPPORT_EMAIL = "support@circuitapp.net"
SEED_CITY_NAME = "Chennai"
SEED_CITY_LAT = "13.0827"
SEED_CITY_LNG = "80.2707"
BETA_MODE = "true"                       # invite-only until public launch
TRUSTED_PROXY_HOPS = "1"                 # Cloud Run's front end is one hop
FEATURES = "pulse:everyone,daily_drop:everyone,circuits:testers"   # PRODUCTION.md §2b, beta start
POLICY_VERSION = "2026-01"
# Backups are off until you add BACKUP_DATABASE_URL (a secret) and BACKUP_AGE_RECIPIENT (the PUBLIC key from `age-keygen -o backup.key`; keep
# backup.key offline). Until then the nightly backup-db job logs "skipped: not configured". Turn this on before real data matters (RUNBOOK).

# Alerts go to these Cloud Monitoring notification channels, by display name. Empty is fine for the first weeks: only
# `make monitoring ENV=production` needs them, and it stops with a clear message while the list is empty. To switch alerts on, create an email
# channel and an SMS or Cloud Console mobile-app channel (Monitoring > Alerting > Edit notification channels) and list their names here.
# infra/monitoring/README.md.
[monitoring]
notification_channels = []
