# Staging on Google Cloud. Postponed until before payments or public launch (PROGRESS.md), but ready: same code, same scripts.
# Values in <angle brackets> are yours to fill in.

[project]
id = "<your-gcp-project-id>"
region = "asia-south1"
billing_account = "<XXXXXX-XXXXXX-XXXXXX>"
budget = "2000INR"

[service]
min_instances = 0
max_instances = 2

secrets = ["GROQ_API_KEY", "RESEND_API_KEY"]

[env]
ENV = "staging"
LLM_PROVIDER = "groq"                    # free tier is allowed outside production
APP_URL = "<https://circuit-app-staging.vercel.app>"
LANDING_URL = "<https://circuit-landing.vercel.app>"
API_URL = "auto"
ALLOWED_HOSTS = ".run.app"
CORS_ALLOWED_ORIGINS = "<https://circuit-app-staging.vercel.app>"
CSRF_TRUSTED_ORIGINS = "https://*.run.app"
ADMIN_PATH = "<pick-a-random-path>/"
SUPABASE_URL = "<https://xxxx.supabase.co>"
STORAGE_PROVIDER = "supabase"
EMAIL_BACKEND = "resend"
EMAIL_FROM = "Circuit <onboarding@resend.dev>"   # the test sender is fine outside production
SUPPORT_EMAIL = "support@example.com"
SEED_CITY_NAME = "Chennai"
SEED_CITY_LAT = "13.0827"
SEED_CITY_LNG = "80.2707"
BETA_MODE = "true"                       # staging tests the gate
TRUSTED_PROXY_HOPS = "1"
FEATURES = "pulse:everyone,daily_drop:everyone,circuits:everyone,investor_mode:everyone,partner_mode:everyone,promotions:everyone,payments:everyone"
RAZORPAY_KEY_ID = ""                     # rzp_test_... when payments are built
