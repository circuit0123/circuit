<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#F3EEF5;text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #F3EEF5; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="padding: 20px 8px 0 8px; height: 44px; display: flex; align-items: center">
    <a href="Main.dc.html" aria-label="Back" style="height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 8px; font-size: 17px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Today</a>
  </div>
  <h1 style="margin: 4px 16px 0 16px; font-size: 34px; line-height: 1.2; font-weight: 600; letter-spacing: -0.022em">Notifications</h1>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
    <section style="margin-top: 32px">
      <h2 style="margin: 0 16px 4px 16px; font-size: 17px; font-weight: 600">{{g.day}}</h2>
      <sc-for list="{{g.items}}" as="n" hint-placeholder-count="2">
        <a href="{{n.href}}" style="display: flex; gap: 16px; align-items: flex-start; padding: 14px 16px">
          <div style="flex: 0 0 40px; width: 40px; height: 40px; border-radius: 999px; background: #0E2019"></div>
          <div style="flex: 1 1 auto; min-width: 0">
            <div style="font-size: 17px; line-height: 1.35">{{n.text}}</div>
            <div style="font-size: 15px; color: #8A8390; margin-top: 2px">{{n.time}}</div>
          </div>
          <sc-if value="{{n.unread}}" hint-placeholder-val="{{ false }}">
            <span aria-label="Unread" style="flex: 0 0 10px; width: 10px; height: 10px; margin-top: 8px; border-radius: 999px; background: #2FBF8A"></span>
          </sc-if>
        </a>
      </sc-for>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { groups: [
      { day: 'Today', items: [
        { text: 'Meera accepted your intro request to Sakthi.', time: '9:41', unread: true, href: 'Chat.dc.html' },
        { text: 'Tatvagrid shortlisted your application for Frontend intern.', time: '8:02', unread: true, href: 'Job.dc.html' },
        { text: 'A circuit was proposed for you with Priya and Arjun.', time: '7:30', unread: false, href: 'Circuits.dc.html' }
      ] },
      { day: 'Yesterday', items: [
        { text: 'Divya replied to your build log "Farm map v2".', time: '6:15 pm', unread: false, href: 'Main.dc.html' },
        { text: 'Harini posted for the first time this week.', time: '11:20 am', unread: false, href: 'Main.dc.html' }
      ] }
    ] };
  }
}
</script>
</body>
</html>
