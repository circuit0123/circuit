<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick your colour</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#F3EEF5;text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #F3EEF5; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div role="progressbar" aria-label="Sign-up progress" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100" style="position: absolute; left: 0; right: 0; top: 0; height: 3px; background: #0E2019"><div style="width: 90%; height: 3px; background: #2FBF8A"></div></div>
  <div style="padding: 20px 16px 0 8px; height: 44px; display: flex; align-items: center; justify-content: space-between">
    <a href="Offer.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <a href="Ready.dc.html" style="font-size: 17px; color: #A79FAD">Skip</a>
  </div>

  <div style="margin: 24px 16px 0 16px">
    <h1 style="margin: 0; font-size: 34px; line-height: 1.2; font-weight: 600; letter-spacing: -0.022em">Pick your colour.</h1>
    <p style="margin: 12px 0 0 0; font-size: 17px; line-height: 1.4; color: #A79FAD">It marks what's live and new. Change it any time in Settings.</p>

    <div role="radiogroup" aria-label="Accent colour" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 12px; margin-top: 40px">
      <sc-for list="{{accents}}" as="a" hint-placeholder-count="6">
        <button role="radio" aria-checked="{{a.checked}}" onClick="{{a.pick}}" style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0; color: {{a.labelColor}}; cursor: pointer">
          <span style="width: 64px; height: 64px; border-radius: 999px; background: {{a.hex}}; box-shadow: {{a.ring}}; display: block"></span>
          <span style="font-size: 15px">{{a.name}}</span>
        </button>
      </sc-for>
    </div>

    <div aria-label="Preview" style="margin-top: 40px; display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 14px; background: #08140F">
      <div style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 12px; background: #0E2019; border: 2px solid {{cur}}"></div>
      <div style="flex: 1; font-size: 17px">Divya shipped offline sync</div>
      <span style="width: 10px; height: 10px; border-radius: 999px; background: {{cur}}"></span>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px">
    <a href="Ready.dc.html" style="width: 100%; height: 50px; border-radius: 12px; background: #00563F; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">Continue</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { k: 0 }; }
  renderVals() {
    var self = this, k = this.state.k;
    var list = [['Emerald', '#2FBF8A'], ['Sky', '#5AC8FA'], ['Indigo', '#8E8CFF'], ['Rose', '#FF6482'], ['Lime', '#B6E85A'], ['Mono', '#F3EEF5']];
    return {
      cur: list[k][1],
      accents: list.map(function (x, i) {
        var on = i === k;
        return { name: x[0], hex: x[1], checked: on ? 'true' : 'false', labelColor: on ? '#F3EEF5' : '#A79FAD',
          ring: on ? '0 0 0 4px #000000, 0 0 0 6px #F3EEF5' : 'none', pick: function () { self.setState({ k: i }); } };
      })
    };
  }
}
</script>
</body>
</html>
