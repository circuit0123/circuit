<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose your role</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#F3EEF5;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #F3EEF5; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div role="progressbar" aria-label="Sign-up progress" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100" style="position: absolute; left: 0; right: 0; top: 0; height: 3px; background: #0E2019"><div style="width: 30%; height: 3px; background: #2FBF8A"></div></div>
  <div style="padding: 20px 8px 0 8px; height: 44px; display: flex; align-items: center">
    <a href="Invite.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
  </div>

  <div style="margin: 24px 16px 0 16px">
    <h1 style="margin: 0; font-size: 34px; line-height: 1.2; font-weight: 600; letter-spacing: -0.022em">What brings you here?</h1>
    <p style="margin: 12px 0 0 0; font-size: 17px; line-height: 1.4; color: #A79FAD">You can add more later.</p>
    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 32px">
      <sc-for list="{{roles}}" as="r" hint-placeholder-count="5">
        <a href="{{r.href}}" style="display: flex; justify-content: space-between; align-items: center; min-height: 64px; padding: 0 20px; border-radius: 14px; background: #08140F; font-size: 17px; font-weight: 500">
          {{r.label}}
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8390" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { roles: [
      { label: 'Find work and internships', href: 'Work.dc.html' },
      { label: 'Build a startup', href: 'Work.dc.html' },
      { label: 'Mentor people', href: 'Work.dc.html' },
      { label: 'Invest', href: 'InvestorFocus.dc.html' },
      { label: 'Run a college or incubator programme', href: 'PartnerType.dc.html' }
    ] };
  }
}
</script>
</body>
</html>
