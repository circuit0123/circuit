<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Circuit Home desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#F3EEF5;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height: 900px; background: #000000; color: #F3EEF5; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-wrap: wrap">

  <nav aria-label="Main" style="flex: 1 1 240px; max-width: 280px; box-sizing: border-box; padding: 32px 24px; border-right: 0.5px solid rgba(255,255,255,0.10); display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px; margin: 0 12px 32px 12px"><svg width="32" height="32" viewBox="0 0 100 100" fill="none" role="img" aria-label="Circuit logo"><path d="M20 68 C20 30, 80 30, 80 68" stroke="#2FBF8A" stroke-width="7" stroke-linecap="round"/><circle cx="20" cy="68" r="9" fill="#2FBF8A" stroke="#000000" stroke-width="4"/><circle cx="80" cy="68" r="9" fill="#2FBF8A" stroke="#000000" stroke-width="4"/><circle cx="50" cy="39.5" r="6" fill="#2FBF8A" stroke="#000000" stroke-width="4"/></svg><span style="font-size: 22px; font-weight: 600; letter-spacing: -0.035em">circuit</span></div>
    <a href="Desktop.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 16px; height: 48px; padding: 0 12px; border-radius: 12px; background: #08140F; font-size: 17px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5v-6H9v6H4z"></path></svg>Home</a>
    <a href="Discover.dc.html" style="display: flex; align-items: center; gap: 16px; height: 48px; padding: 0 12px; border-radius: 12px; font-size: 17px; color: #A79FAD">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>Discover</a>
    <a href="Desktop.dc.html" style="display: flex; align-items: center; gap: 16px; height: 48px; padding: 0 12px; border-radius: 12px; font-size: 17px; color: #A79FAD">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="7.5"></circle><circle cx="12" cy="4.5" r="1.8" fill="#000"></circle><circle cx="5.5" cy="15.8" r="1.8" fill="#000"></circle><circle cx="18.5" cy="15.8" r="1.8" fill="#000"></circle></svg>Circuits</a>
    <a href="Inbox.dc.html" style="display: flex; align-items: center; gap: 16px; height: 48px; padding: 0 12px; border-radius: 12px; font-size: 17px; color: #A79FAD">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Inbox
      <span aria-label="Unread" style="margin-left: auto; width: 8px; height: 8px; border-radius: 999px; background: #2FBF8A"></span></a>
    <a href="Profile.dc.html" style="display: flex; align-items: center; gap: 16px; height: 48px; padding: 0 12px; border-radius: 12px; font-size: 17px; color: #A79FAD">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="4"></circle><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"></path></svg>Profile</a>
    <a href="Desktop.dc.html" style="margin-top: 24px; height: 44px; border-radius: 12px; background: #0E2019; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New build log</a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 40px 48px 64px 48px; display: flex; flex-wrap: wrap; gap: 56px; justify-content: center; align-items: flex-start">

    <div style="flex: 1 1 480px; max-width: 600px; min-width: 0">
      <h1 style="margin: 0; font-size: 36px; line-height: 1.2; font-weight: 600; letter-spacing: -0.022em">Today</h1>

      <section aria-label="Live wire" style="margin-top: 32px; position: relative">
        <div style="position: absolute; left: 0; right: 0; top: 22px; height: 1.5px; background: rgba(255,255,255,0.10)"></div>
        <div style="display: flex; gap: 28px; overflow: hidden; -webkit-mask-image: linear-gradient(to right, #000 85%, transparent); mask-image: linear-gradient(to right, #000 85%, transparent)">
          <sc-for list="{{wire}}" as="n" hint-placeholder-count="8">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 0 0 auto; width: 56px; opacity: {{n.opacity}}">
              <div style="position: relative; width: 44px; height: 44px">
                <div style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 12px; background: #0E2019; border: {{n.ring}}; display: flex; align-items: center; justify-content: center; color: #8A8390">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 16h5l3-8 3 8h5"></path><circle cx="4" cy="16" r="1.4"></circle><circle cx="20" cy="16" r="1.4"></circle></svg>
                </div>
                <div style="position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 999px; background: #142C23; border: 2px solid #000000; box-sizing: border-box"></div>
              </div>
              <div style="font-size: 12px; color: #F3EEF5; letter-spacing: 0.01em">{{n.verb}}</div>
            </div>
          </sc-for>
        </div>
      </section>

      <section aria-label="Pulse" style="margin-top: 56px">
        <h2 style="margin: 0 0 12px 0; font-size: 17px; font-weight: 600">Pulse</h2>
        <sc-for list="{{posts}}" as="p" hint-placeholder-count="2">
          <article style="padding: 24px 0 32px 0; border-bottom: 0.5px solid rgba(255,255,255,0.10)">
            <div style="display: flex; gap: 12px; align-items: center">
              <div style="width: 40px; height: 40px; border-radius: 999px; background: #0E2019"></div>
              <div>
                <div style="font-size: 17px; font-weight: 600">{{p.name}}</div>
                <div style="font-size: 15px; color: #A79FAD">{{p.meta}}</div>
              </div>
            </div>
            <p style="margin: 16px 0 0 0; font-size: 17px; line-height: 1.4; max-width: 540px">{{p.body}}</p>
            <div role="img" aria-label="{{p.alt}}" style="margin-top: 16px; aspect-ratio: 16 / 9; border-radius: 14px; background: #08140F; display: flex; align-items: center; justify-content: center; color: #142C23">
              <svg width="260" height="90" viewBox="0 0 260 90" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M0 70h60l25-40h70l25 25h80"></path><path d="M40 25h50l18 18h60"></path><circle cx="85" cy="30" r="3.5"></circle><circle cx="180" cy="55" r="3.5"></circle></svg>
            </div>
            <div style="display: flex; gap: 24px; margin-top: 12px">
              <button style="height: 44px; border: 0; background: transparent; color: #A79FAD; font-size: 15px; padding: 0; cursor: pointer">Helpful</button>
              <button style="height: 44px; border: 0; background: transparent; color: #A79FAD; font-size: 15px; padding: 0; cursor: pointer">Intro me</button>
              <button style="height: 44px; border: 0; background: transparent; color: #A79FAD; font-size: 15px; padding: 0; cursor: pointer">Let's talk</button>
            </div>
          </article>
        </sc-for>
      </section>
    </div>

    <aside aria-label="Daily Drop" style="flex: 0 1 340px; min-width: 280px; max-width: 340px; padding-top: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px">
        <h2 style="margin: 0; font-size: 17px; font-weight: 600">Your drop</h2>
        <span style="font-size: 15px; color: #A79FAD">1 of 3</span>
      </div>
      <article style="background: #08140F; border-radius: 14px; padding: 24px; box-shadow: 0 12px 40px rgba(0,0,0,.45)">
        <p style="margin: 0; font-size: 22px; line-height: 1.25; font-weight: 500; letter-spacing: -0.012em">Sakthi can help you with <span style="font-weight: 600">mentoring</span></p>
        <div style="font-size: 15px; color: #A79FAD; margin-top: 12px">via Meera, mentor</div>
        <div style="margin-top: 20px; height: 140px; border-radius: 10px; background: #0E2019"></div>
        <div style="font-size: 17px; font-weight: 600; margin-top: 16px">Sakthi Vel</div>
        <div style="font-size: 15px; color: #A79FAD; margin-top: 4px">Backend mentor · Chennai · 4 km</div>
        <div style="font-size: 15px; color: #A79FAD; margin-top: 12px">Strong match</div>
        <button style="margin-top: 24px; width: 100%; height: 50px; border: 0; border-radius: 12px; background: #00563F; color: #FFFFFF; font-size: 17px; font-weight: 600; cursor: pointer">Intro me</button>
        <button style="width: 100%; height: 44px; border: 0; background: transparent; color: #A79FAD; font-size: 17px; cursor: pointer">Skip</button>
      </article>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var verbs = ['shipped', 'hiring', 'needs', 'joined', 'shipped', 'hiring', 'needs', 'joined'];
    return {
      wire: verbs.map(function (v, k) { var u = k < 3; return { verb: v, ring: u ? '2px solid #2FBF8A' : '0', opacity: u ? 1 : 0.6 }; }),
      posts: [
        { name: 'Imran Shaikh', meta: 'Student, Chennai · 4h', body: 'Shipped the offline mode for our farm records app. Syncs when the network comes back, which in most villages we tested is twice a day.', alt: 'Build log image: offline sync screen' },
        { name: 'Divya Subramanian', meta: 'Founder, Tatvagrid · 1d', body: 'We are hiring our first frontend intern. Six months, ₹15,000 a month, and you will own the map.', alt: 'Build log image: map prototype' }
      ]
    };
  }
}
</script>
</body>
</html>
