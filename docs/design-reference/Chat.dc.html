<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Conversation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#F3EEF5;text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #F3EEF5; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">
  <header style="flex: 0 0 auto; padding: 20px 8px 8px 8px; display: flex; align-items: center; gap: 4px; border-bottom: 0.5px solid rgba(255,255,255,0.10); background: rgba(8,20,15,0.78); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px)">
    <a href="Inbox.dc.html" aria-label="Back to Inbox" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div style="width: 36px; height: 36px; border-radius: 999px; background: #0E2019"></div>
    <a href="Person.dc.html" style="flex: 1; min-width: 0; margin-left: 8px">
      <div style="font-size: 17px; font-weight: 600">Meera Krishnan</div>
      <div style="font-size: 12px; color: #A79FAD">Mentor · Chennai</div>
    </a>
    <button aria-label="Report or block" style="width: 44px; height: 44px; border: 0; background: transparent; color: #F3EEF5; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
  </header>

  <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 24px 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px">
    <div style="align-self: center; font-size: 12px; color: #8A8390; margin-bottom: 8px">Today</div>
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
      <div style="align-self: {{m.side}}; max-width: 75%; background: {{m.bg}}; color: {{m.fg}}; border-radius: 18px; padding: 10px 14px; font-size: 17px; line-height: 1.35">{{m.text}}</div>
    </sc-for>
  </div>

  <div style="flex: 0 0 auto; padding: 8px 12px 34px 12px; display: flex; gap: 8px; align-items: center; border-top: 0.5px solid rgba(255,255,255,0.10)">
    <label style="flex: 1; min-width: 0; height: 40px; border-radius: 999px; background: #0E2019; display: flex; align-items: center; padding: 0 16px">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</span>
      <input value="{{draft}}" onChange="{{type}}" placeholder="Message" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #F3EEF5; font-family: inherit; font-size: 17px; outline: none">
    </label>
    <button onClick="{{send}}" aria-label="Send" style="flex: 0 0 40px; width: 40px; height: 40px; border: 0; border-radius: 999px; background: #00563F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { draft: '', list: [
      { me: false, text: 'Saw your farm map build log. Nicely done.' },
      { me: true, text: 'Thank you! I am stuck on the backend for offline sync.' },
      { me: false, text: 'Sakthi is great at exactly that. Want me to introduce you?' },
      { me: false, text: 'Happy to intro you to Sakthi this week.' }
    ] };
  }
  renderVals() {
    var self = this;
    return {
      draft: this.state.draft,
      msgs: this.state.list.slice(-6).map(function (m) {
        return { text: m.text, side: m.me ? 'flex-end' : 'flex-start', bg: m.me ? '#00563F' : '#0E2019', fg: m.me ? '#FFFFFF' : '#F3EEF5' };
      }),
      type: function (e) { self.setState({ draft: e.target.value }); },
      send: function () {
        var t = self.state.draft.trim() || 'Yes please, that would be great.';
        self.setState({ draft: '', list: self.state.list.concat([{ me: true, text: t }]) });
      }
    };
  }
}
</script>
</body>
</html>
