<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Tabs" style="width: 390px; height: 83px; background: rgba(8,20,15,0.78); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 0.5px solid rgba(255,255,255,0.10); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 8px; box-sizing: border-box; font-family: Geist, system-ui, sans-serif; color: #8A8390">
  <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{c.home}}; font-size: 12px; text-decoration: none">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>Home</a>
  <a href="Discover.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{c.discover}}; font-size: 12px; text-decoration: none">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Discover</a>
  <a href="{{c.thirdHref}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{c.circuits}}; font-size: 12px; text-decoration: none">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="4.5" r="1.8" fill="#08140F"/><circle cx="5.5" cy="15.8" r="1.8" fill="#08140F"/><circle cx="18.5" cy="15.8" r="1.8" fill="#08140F"/></svg>{{c.thirdLabel}}</a>
  <a href="Inbox.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{c.inbox}}; font-size: 12px; text-decoration: none">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Inbox</a>
  <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{c.profile}}; font-size: 12px; text-decoration: none">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg>Profile</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","discover","circuits","inbox","profile","none"],"default":"home"},"partner":{"editor":"boolean","default":false},"$preview":{"width":390,"height":83}}'>
class Component extends DCLogic {
  renderVals() {
    var a = this.props.active ?? 'home';
    var p = this.props.partner ?? false;
    var on = '#F3EEF5', off = '#8A8390';
    return { c: {
      home: a === 'home' ? on : off,
      discover: a === 'discover' ? on : off,
      circuits: a === 'circuits' ? on : off,
      inbox: a === 'inbox' ? on : off,
      profile: a === 'profile' ? on : off,
      thirdLabel: p ? 'Dashboard' : 'Circuits',
      thirdHref: p ? 'PartnerHome.dc.html' : 'Circuits.dc.html'
    } };
  }
}
</script>
</body>
</html>
