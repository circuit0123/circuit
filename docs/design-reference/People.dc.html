<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discover People</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#F3EEF5;text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #F3EEF5; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="height: 64px"></div>
  <h1 style="margin: 0 16px; font-size: 34px; line-height: 1.2; font-weight: 600; letter-spacing: -0.022em">Discover</h1>

  <label style="margin: 16px 16px 0 16px; height: 40px; border-radius: 10px; background: #0E2019; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #8A8390">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span>
    <input placeholder="People, startups, roles" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #F3EEF5; font-family: inherit; font-size: 17px; outline: none">
  </label>

  <div role="tablist" aria-label="Discover sections" style="margin: 16px 16px 0 16px; background: #0E2019; border-radius: 10px; padding: 2px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px">
    <a href="People.dc.html" role="tab" aria-selected="true" style="height: 32px; border-radius: 8px; background: #1B382D; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500">People</a>
    <a href="People.dc.html" role="tab" aria-selected="false" style="height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #A79FAD">Startups</a>
    <a href="Discover.dc.html" role="tab" aria-selected="false" style="height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #A79FAD">Jobs</a>
    <a href="Map.dc.html" role="tab" aria-selected="false" style="height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #A79FAD">Map</a>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; margin: 24px 16px 12px 16px">
    <h2 style="margin: 0; font-size: 17px; font-weight: 600">Near you, matched on skills</h2>
    <button style="height: 44px; border: 0; background: transparent; color: #F3EEF5; font-size: 15px; padding: 0; cursor: pointer">Filters</button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px; padding: 0 16px">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
      <a href="Person.dc.html" style="display: block; min-width: 0">
        <div role="img" aria-label="Photo of {{p.name}}" style="aspect-ratio: 4 / 5; border-radius: 14px; background: #08140F; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; color: #142C23">
          <svg width="120" height="110" viewBox="0 0 120 110" fill="currentColor" aria-hidden="true"><circle cx="60" cy="40" r="24"/><path d="M14 110c4-30 22-44 46-44s42 14 46 44z"/></svg>
        </div>
        <div style="font-size: 17px; font-weight: 600; margin-top: 8px">{{p.name}}</div>
        <div style="font-size: 15px; color: #A79FAD; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.role}}</div>
        <div style="font-size: 15px; color: #A79FAD; margin-top: 2px">{{p.fit}}</div>
      </a>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 83px">
    <dc-import name="TabBar" active="discover" hint-size="390px,83px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { people: [
      { name: 'Sakthi Vel', role: 'Backend mentor', fit: 'Strong match' },
      { name: 'Kavya Raman', role: 'Growth lead, healthtech', fit: 'Bridge match' },
      { name: 'Harini Prasad', role: 'Product designer', fit: 'Good match' },
      { name: 'Yamini Iyer', role: 'Founder, edtech', fit: 'Good match' }
    ] };
  }
}
</script>
</body>
</html>
