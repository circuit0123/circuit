<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Partner home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#F3EEF5;text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #F3EEF5; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="padding: 20px 16px 0 16px; height: 44px; display: flex; justify-content: flex-end; align-items: center">
    <button style="height: 32px; padding: 0 16px; border: 0; border-radius: 999px; background: #00563F; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">New</button>
  </div>
  <h1 style="margin: 4px 16px 0 16px; font-size: 34px; line-height: 1.2; font-weight: 600; letter-spacing: -0.022em">Kaveri Tech</h1>

  <section aria-label="Needs your attention" style="margin: 28px 16px 0 16px">
    <h2 style="margin: 0 0 4px 0; font-size: 17px; font-weight: 600">Needs your attention</h2>
    <sc-for list="{{todo}}" as="t" hint-placeholder-count="3">
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 56px; border-bottom: 0.5px solid rgba(255,255,255,0.10); gap: 12px">
        <span style="font-size: 17px">{{t.text}}</span>
        <a href="Org.dc.html" style="flex: 0 0 auto; height: 32px; padding: 0 14px; border-radius: 999px; background: #0E2019; font-size: 15px; font-weight: 500; display: flex; align-items: center">{{t.action}}</a>
      </div>
    </sc-for>
  </section>

  <section aria-label="Cohort health" style="margin: 40px 16px 0 16px">
    <h2 style="margin: 0 0 12px 0; font-size: 17px; font-weight: 600">This week</h2>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="background: #08140F; border-radius: 14px; padding: 16px">
          <div style="font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 500">{{s.n}}</div>
          <div style="font-size: 12px; color: #A79FAD; margin-top: 4px; letter-spacing: 0.01em">{{s.label}}</div>
          <div style="font-size: 12px; color: #8A8390; margin-top: 2px; letter-spacing: 0.01em">{{s.trend}}</div>
        </div>
      </sc-for>
    </div>
  </section>

  <section aria-label="Open calls" style="margin: 40px 16px 0 16px">
    <h2 style="margin: 0 0 12px 0; font-size: 17px; font-weight: 600">Open calls and events</h2>
    <div style="display: flex; gap: 16px; align-items: center">
      <div style="flex: 0 0 52px; height: 52px; border-radius: 12px; background: #08140F; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <span style="font-family: 'Geist Mono', monospace; font-size: 17px; font-weight: 500">14</span>
        <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #A79FAD">NOV</span>
      </div>
      <div style="min-width: 0">
        <div style="font-size: 17px; font-weight: 600">Demo day</div>
        <div style="font-size: 15px; color: #A79FAD">Main auditorium · RSVPs 90% full</div>
      </div>
    </div>
  </section>

  <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 83px">
    <dc-import name="TabBar" active="home" partner="{{ true }}" hint-size="390px,83px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      todo: [
        { text: '12 applications to review', action: 'Review' },
        { text: '3 cohort invites pending', action: 'Remind' },
        { text: 'Internship drive closes Friday', action: 'View' }
      ],
      stats: [
        { n: '148', label: 'Active members', trend: '+12 this week' },
        { n: '36', label: 'Intros accepted', trend: '+5 this week' },
        { n: '7', label: 'Hires', trend: 'Same as last week' }
      ]
    };
  }
}
</script>
</body>
</html>
