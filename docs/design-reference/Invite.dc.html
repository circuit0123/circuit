<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invite code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#F3EEF5;text-decoration:none}
button{font-family:inherit}
input::placeholder{color:#1B382D}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #F3EEF5; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div role="progressbar" aria-label="Sign-up progress" aria-valuenow="15" aria-valuemin="0" aria-valuemax="100" style="position: absolute; left: 0; right: 0; top: 0; height: 3px; background: #0E2019"><div style="width: 15%; height: 3px; background: #2FBF8A"></div></div>
  <div style="padding: 20px 8px 0 8px; height: 44px; display: flex; align-items: center">
    <a href="Welcome.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
  </div>

  <div style="margin: 24px 16px 0 16px">
    <h1 style="margin: 0; font-size: 34px; line-height: 1.2; font-weight: 600; letter-spacing: -0.022em">Got an invite code?</h1>
    <p style="margin: 12px 0 0 0; font-size: 17px; line-height: 1.4; color: #A79FAD">Circuit is invite-only while we're in beta.</p>
    <label style="display: block; margin-top: 40px">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Invite code</span>
      <input value="{{code}}" onChange="{{type}}" placeholder="CIRCUIT-0000" autocapitalize="characters" style="width: 100%; box-sizing: border-box; height: 64px; border: 0; border-radius: 12px; background: #0E2019; color: #F3EEF5; font-family: 'Geist Mono', monospace; font-size: 22px; letter-spacing: 0.08em; padding: 0 20px; outline: none">
    </label>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px">
    <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
      <a href="Role.dc.html" style="width: 100%; height: 50px; border-radius: 12px; background: #00563F; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">Continue</a>
    </sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
      <button disabled style="width: 100%; height: 50px; border: 0; border-radius: 12px; background: #0E2019; color: #8A8390; font-size: 17px; font-weight: 600">Continue</button>
    </sc-if>
    <a href="Invite.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 17px; margin-top: 4px">Join the waitlist</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { code: '' }; }
  renderVals() {
    var self = this, ok = this.state.code.replace(/\s/g, '').length >= 6;
    return { code: this.state.code, ready: ok, notReady: !ok,
      type: function (e) { self.setState({ code: e.target.value.toUpperCase() }); } };
  }
}
</script>
</body>
</html>
