<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Circuit Inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#F3EEF5;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #F3EEF5; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <div style="padding: 20px 16px 0 16px; display: flex; justify-content: flex-end; align-items: center; height: 44px">
    <button aria-label="New message" style="width: 44px; height: 44px; border: 0; background: transparent; color: #F3EEF5; display: flex; align-items: center; justify-content: flex-end; padding: 0; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
    </button>
  </div>
  <h1 style="margin: 4px 16px 0 16px; font-size: 34px; line-height: 1.2; font-weight: 600; letter-spacing: -0.022em">Inbox</h1>

  <div role="tablist" aria-label="Inbox folders" style="margin: 20px 16px 0 16px; background: #0E2019; border-radius: 10px; padding: 2px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
      <button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="height: 32px; border: 0; border-radius: 8px; background: {{t.bg}}; color: {{t.color}}; font-size: 15px; font-weight: 500; cursor: pointer">{{t.label}}</button>
    </sc-for>
  </div>

  <section aria-label="Conversations" style="margin-top: 24px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <a href="Chat.dc.html" style="display: flex; gap: 16px; align-items: center; min-height: 72px; padding: 0 16px">
        <div style="flex: 0 0 48px; width: 48px; height: 48px; border-radius: 999px; background: #0E2019; display: flex; align-items: center; justify-content: center; color: #1B382D">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 15h6l3-6 3 6h6"></path><circle cx="12" cy="9" r="1.3"></circle></svg>
        </div>
        <div style="flex: 1 1 auto; min-width: 0; border-bottom: 0.5px solid rgba(255,255,255,0.10); padding: 14px 0; align-self: stretch; display: flex; flex-direction: column; justify-content: center">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
            <span style="font-size: 17px; font-weight: {{r.weight}}">{{r.name}}</span>
            <span style="font-size: 15px; color: #8A8390; flex: 0 0 auto">{{r.time}}</span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 2px">
            <span style="font-size: 15px; color: #A79FAD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.last}}</span>
            <sc-if value="{{r.unread}}" hint-placeholder-val="{{ false }}">
              <span aria-label="Unread" style="flex: 0 0 10px; width: 10px; height: 10px; border-radius: 999px; background: #2FBF8A"></span>
            </sc-if>
          </div>
        </div>
      </a>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 48px 16px">
        <p style="margin: 0; font-size: 17px; font-weight: 600">No requests right now</p>
        <p style="margin: 8px 0 0 0; font-size: 15px; line-height: 1.4; color: #A79FAD">When someone you're not connected to writes to you, it waits here until you accept.</p>
      </div>
    </sc-if>
  </section>

  <nav aria-label="Tabs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; background: rgba(8,20,15,0.78); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 0.5px solid rgba(255,255,255,0.10); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 8px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8A8390; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5v-6H9v6H4z"></path></svg>Home</a>
    <a href="Discover.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8A8390; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>Discover</a>
    <a href="Circuits.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8A8390; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="7.5"></circle><circle cx="12" cy="4.5" r="1.8" fill="#000"></circle><circle cx="5.5" cy="15.8" r="1.8" fill="#000"></circle><circle cx="18.5" cy="15.8" r="1.8" fill="#000"></circle></svg>Circuits</a>
    <a href="Inbox.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #F3EEF5; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Inbox</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8A8390; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="4"></circle><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'Chats' }; }
  renderVals() {
    var self = this;
    var tab = this.state.tab;
    var chats = [
      { name: 'Meera Krishnan', last: 'Happy to intro you to Sakthi this week.', time: '9:41', unread: true },
      { name: 'Farhan Ali', last: 'Can you share the map prototype?', time: '8:15', unread: true },
      { name: 'Divya Subramanian', last: 'Thanks, that helped a lot.', time: 'Yesterday', unread: false },
      { name: 'Arun Prakash', last: 'See you at the demo day.', time: 'Tue', unread: false },
      { name: 'Ishaan Reddy', last: 'Sent the repo link.', time: 'Mon', unread: false }
    ];
    var rows = tab === 'Chats' ? chats : [];
    var tabs = ['Chats', 'Requests'].map(function (l) {
      var on = l === tab;
      return { label: l, selected: on ? 'true' : 'false', bg: on ? '#1B382D' : 'transparent', color: on ? '#F3EEF5' : '#A79FAD', pick: function () { self.setState({ tab: l }); } };
    });
    return {
      tabs: tabs,
      rows: rows.map(function (r) { return Object.assign({}, r, { weight: r.unread ? 600 : 400 }); }),
      empty: rows.length === 0
    };
  }
}
</script>
</body>
</html>
