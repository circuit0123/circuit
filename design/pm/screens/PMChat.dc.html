<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat with Kavya</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button,input{font-family:inherit}
input::placeholder{color:#7A7D84}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0C; color: #ECEDEF; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <header style="position: relative; padding: 20px 20px 16px 20px; background: #17181B; border-bottom: 1px solid #2E3036; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; top: -30px; right: 60px; width: 56px; height: 220px; background: #00563F; transform: rotate(22deg)"></div>
    <div style="position: relative; display: flex; justify-content: space-between; align-items: center">
      <a href="PMInbox.dc.html" aria-label="Back to inbox" style="width: 40px; height: 40px; border-radius: 999px; background: #222327; color: #ECEDEF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <a href="PMProfile.dc.html" style="height: 32px; padding: 0 12px; border-radius: 999px; background: #0A0A0C; color: #ECEDEF; display: flex; align-items: center; font-size: 13px">View profile</a>
    </div>
    <h1 style="position: relative; margin: 18px 0 0 0; font-size: 40px; line-height: 1; font-weight: 700; letter-spacing: -0.05em">Kavya Raman</h1>
    <div style="position: relative; margin-top: 6px; font-size: 13px; color: #9A9CA3">Growth lead · introduced by Arun on 2 Nov</div>
  </header>

  <section aria-label="Messages" style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 8px">
    <div style="align-self: center; margin-bottom: 4px; font-family: 'Geist Mono', monospace; font-size: 11px; color: #9A9CA3">CIRCUIT #07 STARTED · YOU → KAVYA → FARHAN</div>
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="5">
      <div style="align-self: {{m.side}}; max-width: 78%; background: {{m.bg}}; color: {{m.fg}}; border: 1px solid {{m.border}}; border-radius: {{m.radius}}; padding: 10px 14px; font-size: 15px; line-height: 1.4">{{m.text}}</div>
    </sc-for>
  </section>

  <form onSubmit="{{send}}" style="position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; gap: 8px; align-items: center">
    <label for="chat-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message Kavya</label>
    <input id="chat-input" value="{{draft}}" onChange="{{type}}" placeholder="Message Kavya" autocomplete="off" style="flex: 1 1 auto; min-width: 0; height: 48px; border: 1px solid #2E3036; border-radius: 14px; background: #17181B; color: #ECEDEF; padding: 0 16px; font-size: 15px; outline: none">
    <button type="submit" aria-label="Send" style="flex: 0 0 48px; height: 48px; border: 0; border-radius: 14px; background: {{sendBg}}; color: {{sendFg}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { draft: '', msgs: [
      { me: false, text: 'Arun says you are pricing Circuit for colleges. I did this for two edtechs.' },
      { me: true, text: 'Yes. Per seat or flat per campus?' },
      { me: false, text: 'Flat per campus first. Per-seat pricing scares procurement.' },
      { me: true, text: 'Makes sense. Can you share what you charged?' },
      { me: false, text: 'Sending the pricing sheet tonight.' }
    ] };
  }
  renderVals() {
    var self = this, s = this.state, has = !!s.draft.trim();
    return {
      draft: s.draft, sendBg: has ? '#2FBF8A' : '#222327', sendFg: has ? '#0A0A0C' : '#7A7D84',
      type: function (e) { self.setState({ draft: e.target.value }); },
      send: function (e) { if (e && e.preventDefault) e.preventDefault(); var t = self.state.draft.trim(); if (!t) return;
        self.setState({ draft: '', msgs: self.state.msgs.concat([{ me: true, text: t }]).slice(-6) }); },
      msgs: s.msgs.map(function (m) { return { text: m.text, side: m.me ? 'flex-end' : 'flex-start',
        bg: m.me ? '#272727' : '#17181B', fg: m.me ? '#F1F1F1' : '#ECEDEF', border: m.me ? '#3A3A3A' : '#2E3036',
        radius: m.me ? '18px 18px 4px 18px' : '18px 18px 18px 4px' }; })
    };
  }
}
</script>
</body>
</html>
