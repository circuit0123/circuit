<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0C; color: #ECEDEF; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <div style="padding: 20px 20px 0 20px">
    <a href="PMHome.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 999px; background: #17181B; border: 1px solid #2E3036; color: #ECEDEF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
  </div>
  <h1 style="margin: 16px 20px 0 20px; font-size: 64px; line-height: 0.9; font-weight: 700; letter-spacing: -0.06em">Settings<span style="color: #2FBF8A">.</span></h1>

  <a href="PMProfile.dc.html" style="margin: 20px 20px 0 20px; display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: #272727; color: #F1F1F1">
    <span style="width: 48px; height: 48px; border-radius: 999px; background: #0A0A0C; color: #ECEDEF; display: flex; align-items: center; justify-content: center; font-weight: 700">RS</span>
    <span style="flex: 1">
      <span style="display: block; font-size: 16px; font-weight: 600">Riya S.</span>
      <span style="display: block; font-size: 13px; color: #AAAAAA">Student · Edit profile, offers and needs</span></span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#AAAAAA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>

  <section aria-label="Preferences" style="margin: 16px 20px 0 20px; background: #17181B; border: 1px solid #2E3036; border-radius: 16px; padding: 0 14px">
    <sc-for list="{{toggles}}" as="x" hint-placeholder-count="4">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 62px; border-bottom: {{x.line}}">
        <span style="min-width: 0">
          <span style="display: block; font-size: 15px; font-weight: 500">{{x.label}}</span>
          <span style="display: block; font-size: 12px; color: #9A9CA3; margin-top: 2px">{{x.hint}}</span></span>
        <button role="switch" aria-checked="{{x.checked}}" aria-label="{{x.label}}" onClick="{{x.toggle}}" style="flex: 0 0 50px; height: 30px; border: 0; border-radius: 999px; background: {{x.track}}; padding: 3px; display: flex; justify-content: {{x.justify}}; cursor: pointer">
          <span style="width: 24px; height: 24px; border-radius: 999px; background: {{x.knob}}"></span></button>
      </div>
    </sc-for>
  </section>

  <section aria-label="Account" style="margin: 16px 20px 0 20px; background: #17181B; border: 1px solid #2E3036; border-radius: 16px; padding: 0 14px">
    <a href="PMSettings.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-bottom: 1px solid #2E3036; color: #ECEDEF; font-size: 15px">Export my data<span style="color: #9A9CA3">›</span></a>
    <a href="PMSettings.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; color: #ECEDEF; font-size: 15px">Sign out<span style="color: #9A9CA3">›</span></a>
  </section>
  <div style="margin: 12px 20px 0 20px; font-family: 'Geist Mono', monospace; font-size: 11px; color: #7A7D84">CIRCUIT BETA · [VERSION]</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: { priv: false, drop: true, intro: true, map: true } }; }
  renderVals() {
    var self = this, s = this.state;
    var rows = [
      ['priv', 'Private profile', 'Only people you have met can see you'],
      ['drop', 'Daily introductions', 'Three people at 8:00 AM'],
      ['intro', 'Allow intro requests', 'Mutuals can introduce you'],
      ['map', 'Show me on the map', 'Neighbourhood only, never exact']
    ];
    return {
      toggles: rows.map(function (r, k) { var on = !!s.on[r[0]]; return {
        label: r[1], hint: r[2], checked: on ? 'true' : 'false',
        track: on ? '#2FBF8A' : '#2E3036', knob: on ? '#0A0A0C' : '#9A9CA3', justify: on ? 'flex-end' : 'flex-start',
        line: k < rows.length - 1 ? '1px solid #2E3036' : '0',
        toggle: function () { var n = Object.assign({}, s.on); n[r[0]] = !on; self.setState({ on: n }); } }; })
    };
  }
}
</script>
</body>
</html>
