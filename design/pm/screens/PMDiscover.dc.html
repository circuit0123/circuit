<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0C; color: #ECEDEF; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <div role="tablist" aria-label="Discover sections" style="padding: 24px 20px 0 20px; display: flex; gap: 6px">
    <sc-for list="{{segments}}" as="s" hint-placeholder-count="4">
      <button role="tab" aria-selected="{{s.selected}}" onClick="{{s.pick}}" style="height: 36px; padding: 0 14px; border: 1px solid {{s.border}}; border-radius: 999px; background: {{s.bg}}; color: {{s.color}}; font-size: 14px; font-weight: 600; cursor: pointer">{{s.label}}</button>
    </sc-for>
  </div>

  <div style="position: relative; margin: 18px 20px 0 20px; display: flex; justify-content: space-between; align-items: flex-end">
    <h1 style="margin: 0; font-size: 72px; line-height: 0.9; font-weight: 700; letter-spacing: -0.06em">{{seg}}<span style="color: #2FBF8A">.</span></h1>
    <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #9A9CA3; margin-bottom: 8px">{{count}} · 10 KM</span>
  </div>

  <sc-if value="{{showJobs}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; gap: 6px; padding: 0 20px; margin-top: 16px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
        <button aria-pressed="{{f.pressed}}" onClick="{{f.toggle}}" style="height: 32px; border: 1px solid {{f.border}}; border-radius: 8px; padding: 0 12px; background: {{f.bg}}; color: {{f.color}}; font-size: 13px; font-weight: 500; cursor: pointer">{{f.label}}</button>
      </sc-for>
    </div>
    <section aria-label="Roles that fit you" style="margin: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{jobs}}" as="j" hint-placeholder-count="4">
        <a href="PMJob.dc.html" style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 14px 16px; border-radius: 16px; background: {{j.bg}}; color: {{j.fg}}; border: 1px solid {{j.border}}; transform: rotate({{j.tilt}})">
          <span style="min-width: 0">
            <span style="display: flex; align-items: center; gap: 8px">
              <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.02em">{{j.title}}</span>
              <sc-if value="{{j.isNew}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.06em; background: {{j.tagBg}}; color: {{j.tagFg}}; border-radius: 4px; padding: 2px 6px">NEW</span>
              </sc-if></span>
            <span style="display: block; font-size: 13px; color: {{j.sub}}; margin-top: 3px">{{j.where}}</span>
            <span style="display: block; font-family: 'Geist Mono', monospace; font-size: 11px; color: {{j.sub}}; margin-top: 6px">{{j.fit}}</span></span>
          <span style="text-align: right; flex: 0 0 auto">
            <span style="display: block; font-size: 24px; font-weight: 700; letter-spacing: -0.04em; color: {{j.pay}}">{{j.amount}}</span>
            <span style="display: block; font-family: 'Geist Mono', monospace; font-size: 10px; color: {{j.sub}}">{{j.per}}</span></span>
        </a>
      </sc-for>
    </section>
  </sc-if>

  <sc-if value="{{showJump}}" hint-placeholder-val="{{ false }}">
    <a href="{{jumpHref}}" style="margin: 20px 20px 0 20px; display: flex; justify-content: space-between; align-items: center; padding: 22px; border-radius: 20px; background: #272727; color: #F1F1F1">
      <span>
        <span style="display: block; font-size: 24px; font-weight: 700; letter-spacing: -0.04em">{{jumpLabel}}</span>
        <span style="display: block; font-size: 14px; color: #AAAAAA; margin-top: 4px">{{jumpSub}}</span></span>
      <span style="width: 44px; height: 44px; border-radius: 999px; background: #00563F; color: #ECEDEF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
  </sc-if>

  <div style="position: absolute; left: 12px; bottom: 14px">
    <dc-import name="PMNav" active="discover" hint-size="366px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { seg: 'Jobs', on: { 'Paid': true } }; }
  renderVals() {
    var self = this, seg = this.state.seg, on = this.state.on;
    var all = [
      { title: 'Frontend intern', where: 'Tatvagrid · Agritech · 3.2 km', fit: 'YOU MATCH 4 OF 5 SKILLS', amount: '₹15k', per: 'PER MONTH', isNew: true, remote: false, paid: true },
      { title: 'Backend engineer', where: 'Sutragrid · Logistics · 5.8 km', fit: 'YOU MATCH 3 OF 4 SKILLS', amount: '₹6–8L', per: 'PER YEAR', isNew: true, remote: true, paid: true },
      { title: 'Embedded intern', where: 'Zetapulse · Deeptech · 7.1 km', fit: 'YOU MATCH 2 OF 3 SKILLS', amount: '₹12k', per: 'PER MONTH', isNew: false, remote: false, paid: true },
      { title: 'Design volunteer', where: 'Kalvi Labs · Edtech · 2.4 km', fit: 'YOU MATCH 3 OF 3 SKILLS', amount: '₹0', per: 'UNPAID', isNew: false, remote: true, paid: false }
    ];
    var jobs = all.filter(function (j) { return (!on['Remote'] || j.remote) && (!on['Paid'] || j.paid) && (!on['New'] || j.isNew); });
    var tilts = ['-0.6deg', '0deg', '0.5deg', '0deg'];
    var jump = { People: ['PMPeople.dc.html', '6 people near you', 'Mentors, founders and students within 10 km'], Startups: ['PMMap.dc.html', '6 startups nearby', 'See who is hiring on the map'], Map: ['PMMap.dc.html', 'Open the map', 'Startups and people around Guindy'] }[seg];
    return {
      seg: seg, count: jump ? '6 NEARBY' : jobs.length + ' ROLES',
      showJobs: !jump, showJump: !!jump, jumpHref: jump ? jump[0] : '', jumpLabel: jump ? jump[1] : '', jumpSub: jump ? jump[2] : '',
      jobs: jobs.map(function (j, k) { var light = k === 0; return Object.assign({}, j, {
        tilt: tilts[k % 4], bg: light ? '#272727' : '#17181B', fg: light ? '#F1F1F1' : '#ECEDEF', border: light ? '#3A3A3A' : '#2E3036',
        sub: light ? '#AAAAAA' : '#9A9CA3', pay: light ? '#2FBF8A' : '#2FBF8A', tagBg: light ? '#00563F' : '#0F2A21', tagFg: light ? '#ECEDEF' : '#2FBF8A' }); }),
      segments: ['People', 'Startups', 'Jobs', 'Map'].map(function (l) { var sel = l === seg;
        return { label: l, selected: sel ? 'true' : 'false', bg: sel ? '#272727' : '#17181B', color: sel ? '#F1F1F1' : '#ECEDEF', border: sel ? '#2FBF8A' : '#2E3036', pick: function () { self.setState({ seg: l }); } }; }),
      filters: ['Paid', 'Remote', 'New'].map(function (l) { var p = !!on[l];
        return { label: l, pressed: p ? 'true' : 'false', bg: p ? '#0F2A21' : 'transparent', color: p ? '#2FBF8A' : '#9A9CA3', border: p ? '#00563F' : '#2E3036',
          toggle: function () { var n = Object.assign({}, on); n[l] = !p; self.setState({ on: n }); } }; })
    };
  }
}
</script>
</body>
</html>
