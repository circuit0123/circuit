<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0C; color: #ECEDEF; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; inset: 0">
    <g stroke="#1C1D21" stroke-width="1.2" fill="none">
      <path d="M-10 120 L400 180"></path><path d="M-10 300 L400 250"></path><path d="M-10 420 L400 470"></path><path d="M-10 560 L400 520"></path>
      <path d="M60 -10 L90 860"></path><path d="M170 -10 L150 860"></path><path d="M260 -10 L300 860"></path><path d="M350 -10 L330 860"></path>
    </g>
    <g stroke="#2E3036" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M-20 380 C 100 360, 180 300, 410 330"></path><path d="M210 -20 C 220 200, 180 400, 240 860"></path>
    </g>
    <path d="M-20 640 C 120 600, 260 690, 410 610 L410 700 C 260 760, 120 690, -20 720 Z" fill="#101113"></path>
    <text x="24" y="682" font-family="Geist Mono, monospace" font-size="10" letter-spacing="2" fill="#4A4C52">ADYAR RIVER</text>
    <text x="222" y="318" font-family="Geist Mono, monospace" font-size="10" letter-spacing="2" fill="#4A4C52">GST ROAD</text>
  </svg>

  <div style="position: relative; padding: 20px 20px 0 20px; display: flex; justify-content: space-between; align-items: center">
    <a href="PMDiscover.dc.html" aria-label="Back to Discover" style="width: 40px; height: 40px; border-radius: 999px; background: #17181B; border: 1px solid #2E3036; color: #ECEDEF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <span style="height: 34px; padding: 0 12px; border-radius: 999px; background: #17181B; border: 1px solid #2E3036; display: flex; align-items: center; gap: 8px; font-size: 13px">Guindy · 10 km <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #9A9CA3">{{n}} STARTUPS</span></span>
  </div>
  <h1 style="position: relative; margin: 14px 20px 0 20px; font-size: 64px; line-height: 0.9; font-weight: 700; letter-spacing: -0.06em">Nearby<span style="color: #2FBF8A">.</span></h1>

  <div aria-label="You are here" style="position: absolute; left: 196px; top: 372px; width: 18px; height: 18px; border-radius: 999px; background: #ECEDEF; border: 4px solid #0A0A0C; box-shadow: 0 0 0 10px rgba(47,191,138,0.18)"></div>

  <sc-for list="{{pins}}" as="p" hint-placeholder-count="6">
    <button onClick="{{p.pick}}" aria-label="{{p.name}}, {{p.hiringLabel}}" aria-pressed="{{p.sel}}" style="position: absolute; left: {{p.x}}; top: {{p.y}}; height: {{p.h}}; padding: 0 10px; border: 1px solid {{p.border}}; border-radius: 999px; background: {{p.bg}}; color: {{p.fg}}; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap">
      <span style="width: 7px; height: 7px; border-radius: 999px; background: {{p.dot}}"></span>{{p.name}}</button>
  </sc-for>

  <section aria-label="Selected startup" style="position: absolute; left: 20px; right: 20px; bottom: 96px; background: #272727; color: #F1F1F1; border-radius: 20px; padding: 16px">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
      <div>
        <div style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #AAAAAA">{{s.sector}} · {{s.km}}</div>
        <div style="font-size: 28px; font-weight: 700; letter-spacing: -0.04em; margin-top: 2px">{{s.name}}</div>
      </div>
      <span style="flex: 0 0 auto; background: {{s.tagBg}}; color: {{s.tagFg}}; border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 600">{{s.hiring}}</span>
    </div>
    <p style="margin: 6px 0 0 0; font-size: 14px; line-height: 1.4; color: #D0D0D0">{{s.line}}</p>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 12px">
      <a href="PMProfile.dc.html" style="height: 44px; box-sizing: border-box; border: 1px solid #4A4A4A; border-radius: 12px; color: #F1F1F1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">Follow</a>
      <a href="{{s.href}}" style="height: 44px; border-radius: 12px; background: #00563F; color: #ECEDEF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">{{s.cta}}</a>
    </div>
  </section>

  <div style="position: absolute; left: 12px; bottom: 14px">
    <dc-import name="PMNav" active="discover" hint-size="366px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'TG' }; }
  renderVals() {
    var self = this, sel = this.state.sel;
    var all = [
      { id: 'TG', name: 'Tatvagrid', sector: 'AGRITECH', km: '3.2 KM', x: 40, y: 240, hiring: true, line: 'Farm maps for field teams. Two open roles: frontend intern, backend engineer.', cta: 'See 2 roles', href: 'PMJob.dc.html' },
      { id: 'SG', name: 'Sutragrid', sector: 'LOGISTICS', km: '5.8 KM', x: 236, y: 206, hiring: true, line: 'Route planning for small fleets. One backend role on their careers page.', cta: 'Careers page', href: 'PMJob.dc.html' },
      { id: 'ZP', name: 'Zetapulse', sector: 'DEEPTECH', km: '7.1 KM', x: 232, y: 430, hiring: true, line: 'Low-power sensors for cold chains. Embedded intern open.', cta: 'See 1 role', href: 'PMJob.dc.html' },
      { id: 'KL', name: 'Kalvi Labs', sector: 'EDTECH', km: '2.4 KM', x: 60, y: 456, hiring: false, line: 'Tamil-first maths practice for classes 6–10. No open roles right now.', cta: 'Message founder', href: 'PMChat.dc.html' },
      { id: 'NV', name: 'Navalam', sector: 'CLIMATE', km: '4.0 KM', x: 24, y: 340, hiring: false, line: 'Rooftop solar financing for apartment blocks.', cta: 'Message founder', href: 'PMChat.dc.html' },
      { id: 'PX', name: 'Pixelpaati', sector: 'D2C', km: '6.6 KM', x: 260, y: 318, hiring: true, line: 'Handloom sarees online. Hiring a growth intern.', cta: 'Careers page', href: 'PMJob.dc.html' }
    ];
    var s = all.filter(function (p) { return p.id === sel; })[0] || all[0];
    return {
      n: all.length,
      s: Object.assign({}, s, { hiring: s.hiring ? 'Hiring' : 'No open roles', tagBg: s.hiring ? '#00563F' : '#0A0A0C', tagFg: '#ECEDEF' }),
      pins: all.map(function (p) { var on = p.id === sel; return {
        name: p.name, hiringLabel: p.hiring ? 'hiring' : 'no open roles', sel: on ? 'true' : 'false', x: p.x + 'px', y: p.y + 'px', h: on ? '36px' : '30px',
        bg: on ? '#272727' : '#17181B', fg: on ? '#F1F1F1' : '#ECEDEF', border: on ? '#2FBF8A' : '#2E3036',
        dot: p.hiring ? (on ? '#00563F' : '#2FBF8A') : '#7A7D84',
        pick: function () { self.setState({ sel: p.id }); } }; })
    };
  }
}
</script>
</body>
</html>
