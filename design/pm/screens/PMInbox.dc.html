<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0C; color: #ECEDEF; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <div style="padding: 28px 20px 0 20px; display: flex; justify-content: space-between; align-items: flex-end">
    <h1 style="margin: 0; font-size: 72px; line-height: 0.9; font-weight: 700; letter-spacing: -0.06em">Inbox<span style="color: #2FBF8A">.</span></h1>
    <span style="margin-bottom: 8px; font-family: 'Geist Mono', monospace; font-size: 11px; color: #9A9CA3">3 UNREAD</span>
  </div>

  <div role="tablist" aria-label="Inbox sections" style="margin: 16px 20px 0 20px; display: flex; gap: 6px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
      <button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="height: 34px; padding: 0 14px; border: 1px solid {{t.border}}; border-radius: 999px; background: {{t.bg}}; color: {{t.color}}; font-size: 14px; font-weight: 600; cursor: pointer">{{t.label}}</button>
    </sc-for>
  </div>

  <sc-if value="{{showIntro}}" hint-placeholder-val="{{ true }}">
    <section aria-label="Pending introduction" style="margin: 16px 20px 0 20px; background: #272727; color: #F1F1F1; border-radius: 18px; padding: 16px; transform: rotate(-0.6deg)">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #AAAAAA">INTRO REQUEST · FROM MEERA</span>
        <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #AAAAAA">8m</span></div>
      <p style="margin: 8px 0 0 0; font-size: 16px; line-height: 1.4; font-weight: 500">“Sakthi has built offline sync twice. Talk to him before you pick a database.”</p>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 8px; margin-top: 14px">
        <button onClick="{{later}}" style="height: 44px; border: 1px solid #4A4A4A; border-radius: 12px; background: transparent; color: #F1F1F1; font-size: 14px; font-weight: 600; cursor: pointer">Later</button>
        <a href="PMChat.dc.html" style="height: 44px; border-radius: 12px; background: #00563F; color: #ECEDEF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">Accept and say hi</a>
      </div>
    </section>
  </sc-if>

  <section aria-label="Conversations" style="margin: 12px 20px 0 20px">
    <sc-for list="{{threads}}" as="t" hint-placeholder-count="5">
      <a href="PMChat.dc.html" style="display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #1F2024; color: #ECEDEF">
        <span style="flex: 0 0 44px; height: 44px; border-radius: 999px; background: {{t.av}}; color: {{t.avFg}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">{{t.ini}}</span>
        <span style="flex: 1 1 auto; min-width: 0">
          <span style="display: flex; justify-content: space-between; gap: 8px">
            <span style="font-size: 15px; font-weight: {{t.weight}}">{{t.name}}</span>
            <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #9A9CA3">{{t.time}}</span></span>
          <span style="display: flex; justify-content: space-between; gap: 8px; margin-top: 3px">
            <span style="font-size: 14px; color: {{t.msgColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.msg}}</span>
            <span style="flex: 0 0 auto; width: 8px; height: 8px; margin-top: 5px; border-radius: 999px; background: {{t.dot}}"></span></span>
        </span>
      </a>
    </sc-for>
  </section>

  <div style="position: absolute; left: 12px; bottom: 14px">
    <dc-import name="PMNav" active="inbox" hint-size="366px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'All', intro: true }; }
  renderVals() {
    var self = this, tab = this.state.tab;
    var chats = [
      { ini: 'KR', name: 'Kavya Raman', msg: 'Sending the pricing sheet tonight', time: '2m', unread: true },
      { ini: 'FA', name: 'Farhan Ali', msg: 'Can you do Thursday at the incubator?', time: '1h', unread: true },
      { ini: 'C7', name: 'Circuit #07 · You, Kavya, Farhan', msg: 'Kavya: I can take the launch plan', time: '3h', unread: true, circuit: true },
      { ini: 'DV', name: 'Divya · Tatvagrid', msg: 'You: Thanks, sent my GitHub', time: 'Mon', unread: false },
      { ini: 'AS', name: 'Arun S', msg: 'You: Same college, yes!', time: 'Sun', unread: false }
    ];
    var list = tab === 'All' ? chats : chats.filter(function (c) { return c.unread; });
    return {
      showIntro: this.state.intro && tab === 'All',
      later: function () { self.setState({ intro: false }); },
      threads: list.map(function (c) { return Object.assign({}, c, {
        weight: c.unread ? 600 : 400, msgColor: c.unread ? '#ECEDEF' : '#9A9CA3', dot: c.unread ? '#2FBF8A' : 'transparent',
        av: c.circuit ? '#0F2A21' : '#222327', avFg: c.circuit ? '#2FBF8A' : '#ECEDEF' }); }),
      tabs: ['All', 'Unread'].map(function (l) { var on = l === tab;
        return { label: l, selected: on ? 'true' : 'false', bg: on ? '#272727' : '#17181B', color: on ? '#F1F1F1' : '#ECEDEF', border: on ? '#2FBF8A' : '#2E3036', pick: function () { self.setState({ tab: l }); } }; })
    };
  }
}
</script>
</body>
</html>
