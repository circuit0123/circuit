<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invite code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button,input{font-family:inherit}
input::placeholder{color:#8A8D93}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0C; color: #ECEDEF; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <div style="padding: 20px 20px 0 20px; display: flex; justify-content: space-between; align-items: center">
    <a href="PMWelcome.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 999px; background: #17181B; border: 1px solid #2E3036; color: #ECEDEF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #9A9CA3">STEP 1 OF 4</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 14px 20px 0 20px"><span style="height: 3px; border-radius: 9px; background: #2FBF8A"></span><span style="height: 3px; border-radius: 9px; background: #2E3036"></span><span style="height: 3px; border-radius: 9px; background: #2E3036"></span><span style="height: 3px; border-radius: 9px; background: #2E3036"></span></div>

  <h1 style="margin: 36px 20px 0 20px; font-size: 56px; line-height: 0.95; font-weight: 700; letter-spacing: -0.06em">Got an<br><span style="color: transparent; -webkit-text-stroke: 1.5px #ECEDEF">invite code?</span></h1>
  <p style="margin: 14px 20px 0 20px; font-size: 15px; line-height: 1.45; color: #9A9CA3">Circuit is invite-only while we start in Chennai. Codes come from a friend, a mentor or your college.</p>

  <div style="margin: 24px 20px 0 20px; background: #272727; color: #F1F1F1; border-radius: 18px; padding: 16px">
    <label for="code" style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #AAAAAA">INVITE CODE · 10 CHARACTERS</label>
    <input id="code" value="{{code}}" onChange="{{type}}" placeholder="XXXXXXXXXX" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" style="display: block; width: 100%; box-sizing: border-box; margin-top: 8px; height: 56px; border: 0; border-bottom: 2px solid #4A4A4A; background: transparent; color: #F1F1F1; font-family: 'Geist Mono', monospace; font-size: 26px; font-weight: 500; letter-spacing: 0.16em; outline: none">
    <div role="status" style="margin-top: 10px; font-size: 13px; color: {{hintColor}}">{{hint}}</div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 36px">
    <sc-if value="{{ok}}" hint-placeholder-val="{{ false }}">
      <a href="PMRole.dc.html" style="height: 52px; border-radius: 14px; background: #2FBF8A; color: #0A0A0C; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Continue</a>
    </sc-if>
    <sc-if value="{{notOk}}" hint-placeholder-val="{{ true }}">
      <button disabled style="width: 100%; height: 52px; border: 0; border-radius: 14px; background: #17181B; color: #5A5C62; font-size: 16px; font-weight: 600">Continue</button>
    </sc-if>
    <a href="PMWelcome.dc.html" style="display: block; text-align: center; margin-top: 14px; font-size: 14px; color: #9A9CA3; text-decoration: underline">No code? Join the waitlist</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { code: '' }; }
  renderVals() {
    var self = this, c = this.state.code, n = c.length, ok = n === 10;
    return {
      code: c, ok: ok, notOk: !ok,
      hint: ok ? 'Looks right.' : (n ? (10 - n) + ' more characters' : 'Letters and numbers, no spaces'),
      hintColor: ok ? '#2FBF8A' : '#AAAAAA',
      type: function (e) { self.setState({ code: e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10) }); }
    };
  }
}
</script>
</body>
</html>
