<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>People nearby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0C; color: #ECEDEF; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <div style="padding: 28px 20px 0 20px; display: flex; justify-content: space-between; align-items: flex-end">
    <h1 style="margin: 0; font-size: 72px; line-height: 0.9; font-weight: 700; letter-spacing: -0.06em">People<span style="color: #2FBF8A">.</span></h1>
    <span style="margin-bottom: 8px; font-family: 'Geist Mono', monospace; font-size: 11px; color: #9A9CA3">{{count}} NEARBY</span>
  </div>

  <div style="display: flex; gap: 6px; padding: 16px 20px 0 20px">
    <sc-for list="{{roles}}" as="r" hint-placeholder-count="4">
      <button aria-pressed="{{r.pressed}}" onClick="{{r.pick}}" style="height: 34px; padding: 0 12px; border: 1px solid {{r.border}}; border-radius: 999px; background: {{r.bg}}; color: {{r.color}}; font-size: 13px; font-weight: 600; cursor: pointer">{{r.label}}</button>
    </sc-for>
  </div>

  <section aria-label="People near you" style="margin: 16px 20px 0 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="6">
      <a href="PMProfile.dc.html" style="display: flex; flex-direction: column; justify-content: space-between; min-height: 148px; box-sizing: border-box; padding: 14px; border-radius: 16px; background: {{p.bg}}; color: {{p.fg}}; border: 1px solid {{p.border}}">
        <span style="display: flex; justify-content: space-between; align-items: flex-start">
          <span style="width: 40px; height: 40px; border-radius: 999px; background: {{p.avBg}}; color: {{p.avFg}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{p.ini}}</span>
          <span style="font-family: 'Geist Mono', monospace; font-size: 10px; color: {{p.sub}}">{{p.km}}</span></span>
        <span>
          <span style="display: block; font-size: 15px; font-weight: 600">{{p.name}}</span>
          <span style="display: block; font-size: 12px; color: {{p.sub}}; margin-top: 2px">{{p.role}}</span>
          <span style="display: block; font-size: 12px; margin-top: 6px">Offers <strong style="color: {{p.em}}">{{p.offers}}</strong></span></span>
      </a>
    </sc-for>
  </section>

  <div style="position: absolute; left: 12px; bottom: 14px">
    <dc-import name="PMNav" active="discover" hint-size="366px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { role: 'All' }; }
  renderVals() {
    var self = this, role = this.state.role;
    var all = [
      { ini: 'SV', name: 'Sakthi Vel', role: 'Mentor', km: '4 KM', offers: 'API design' },
      { ini: 'KR', name: 'Kavya Raman', role: 'Mentor', km: '11 KM', offers: 'Pricing' },
      { ini: 'FA', name: 'Farhan Ali', role: 'Founder', km: '6 KM', offers: 'Agri intros' },
      { ini: 'DV', name: 'Divya M', role: 'Founder', km: '3 KM', offers: 'Internships' },
      { ini: 'IS', name: 'Ishaan S', role: 'Student', km: '2 KM', offers: 'Flutter' },
      { ini: 'NP', name: 'Nila P', role: 'Student', km: '5 KM', offers: 'UI design' }
    ];
    var list = all.filter(function (p) { return role === 'All' || p.role + 's' === role; });
    return {
      count: list.length,
      people: list.map(function (p, k) { var light = k === 0; return Object.assign({}, p, {
        bg: light ? '#272727' : '#17181B', fg: light ? '#F1F1F1' : '#ECEDEF', border: light ? '#3A3A3A' : '#2E3036',
        sub: light ? '#AAAAAA' : '#9A9CA3', em: light ? '#2FBF8A' : '#2FBF8A',
        avBg: light ? '#0A0A0C' : '#222327', avFg: light ? '#ECEDEF' : '#ECEDEF' }); }),
      roles: ['All', 'Mentors', 'Founders', 'Students'].map(function (l) { var on = l === role;
        return { label: l, pressed: on ? 'true' : 'false', bg: on ? '#272727' : '#17181B', color: on ? '#F1F1F1' : '#ECEDEF', border: on ? '#2FBF8A' : '#2E3036', pick: function () { self.setState({ role: l }); } }; })
    };
  }
}
</script>
</body>
</html>
